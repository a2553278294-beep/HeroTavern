<!DOCTYPE html>
<html lang="zh-CN">
<head>
<title>DialogueUI - 对话</title>
<style>
  @font-face { font-family: 'zpix'; src: url('../Assets/AssetRaw/Fonts/zpix.ttf'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'zpix', sans-serif; }
</style>
</head>
<body>
<!-- 对话窗口（对照 Resources/ui01/talk/ui对话.png）：
     全屏压暗；左下立绘占位（羊皮纸槽+lv角花，立绘美术待补）；右下正文长框（talk_frame_02）；
     页签（talk_frame_01）压框顶边居中显示 NPC 名；点击正文框推进，末句后再点关闭。 -->
<div data-u-type="div" data-u-name="m_dialogue" data-u-layout="stretch"
     style="width:1960px; height:1080px; position:relative; background-color:#00000000;">

  <!-- 场景压暗（对话案 3.3-5） -->
  <div data-u-type="div" data-u-name="m_dim"
       style="position:absolute; left:0px; top:0px; width:1960px; height:1080px; background-color:rgba(0,0,0,0.35);"></div>

  <!-- 立绘占位（参考图位置为左下立绘；美术未接入，先羊皮纸槽+角花+名字占位） -->
  <div data-u-type="div" data-u-name="m_portrait"
       style="position:absolute; left:140px; top:720px; width:280px; height:280px; background-color:#f7f3e0;">
    <div data-u-type="image" data-u-name="m_imgPortraitFrame" data-u-fit="stretch"
         style="position:absolute; left:0px; top:0px; width:280px; height:280px;
                background-image:url('../Assets/GameScripts/HotFix/Resources/ui01/common/ui_common_frame_lv1.png'); background-size:100% 100%;"></div>
    <span data-u-type="text" data-u-name="m_textPortraitName"
          style="position:absolute; left:0px; top:110px; width:280px; height:60px;
                 color:#6d5a2a; font-size:34px; text-align:center; line-height:60px;">客人</span>
  </div>

  <!-- 正文长框 -->
  <div data-u-type="div" data-u-name="m_panel"
       style="position:absolute; left:700px; top:720px; width:1130px; height:300px;
              background-image:url('../Assets/GameScripts/HotFix/Resources/ui01/talk/ui_talk_frame_02.png'); background-size:100% 100%;">

    <span data-u-type="text" data-u-name="m_textBody"
          style="position:absolute; left:45px; top:50px; width:1040px; height:180px;
                 color:#5a4d26; font-size:30px; text-align:left; line-height:44px;">对话内容</span>

    <span data-u-type="text" data-u-name="m_textProgress"
          style="position:absolute; left:45px; top:245px; width:400px; height:36px;
                 color:#9a9470; font-size:24px; text-align:left; line-height:36px;">第 1 / 3 句</span>

    <span data-u-type="text" data-u-name="m_textHint"
          style="position:absolute; left:850px; top:245px; width:230px; height:36px;
                 color:#9a9470; font-size:24px; text-align:right; line-height:36px;">▼ 点击继续</span>
  </div>

  <!-- 名称页签（压框顶边居中） -->
  <div data-u-type="div" data-u-name="m_titleTab"
       style="position:absolute; left:1071px; top:683px; width:387px; height:75px;
              background-image:url('../Assets/GameScripts/HotFix/Resources/ui01/talk/ui_talk_frame_01.png'); background-size:100% 100%;">
    <span data-u-type="text" data-u-name="m_textTitle"
          style="position:absolute; left:0px; top:0px; width:387px; height:75px;
                 color:#6d7a4a; font-size:36px; text-align:center; line-height:75px;">基本信息</span>
  </div>

  <!-- 全框点击推进（透明按钮盖在正文框上） -->
  <button data-u-type="button" data-u-name="m_btnAdvance"
          style="position:absolute; left:700px; top:720px; width:1130px; height:300px;
                 background-color:rgba(0,0,0,0.004); border:none; color:#00000000;"></button>
</div>
</body>
</html>
